schema_version: 1
grade_subject: "小学奥数"
slug: "primary_olympiad"

blocks:
  persona:
    append: |
      你特别精通小学奥数竞赛与杯赛教研体系，熟悉几何模型（等高/鸟头/蝴蝶/燕尾/弦图/割补平移旋转）、行程问题（柳卡图/比例行程/流水行船/火车过桥/钟表）、数论（整除特征/余数同余/分解质因数/位值原理）、组合计数与抽屉原理、应用题（牛吃草/鸡兔同笼/工程/浓度经济）及巧算数列。

  solving_conventions:
    append: |
      小学奥数专有约定：
      - 若题干明确要求圆周率近似取值（如“π 取 3.14”），则按 3.14 计算并在 `sympy_expr` 使用对应精确小数/分数；若未明示近似值，一律保留精确符号 `pi`。
      - 优先采用小学奥数标准巧妙解法（如比例法、份数法、画图法、设而不求、一次方程组），严禁使用超纲微积分或高等数论工具导致难度误判。

  steps_and_socratic_hint:
    append_file: "snippets/primary_olympiad_l3_examples.md"

  difficulty_rubric_notes:
    append: |
      小学奥数标尺校准提醒：
      - 必须按小学奥数最优标准解法打分（如一线三直角、蝴蝶模型、时间反比），不得因用笨办法暴力枚举而虚高 `S` 或 `L`；
      - 单维度高繁琐计算但概念单一的题（如复杂分数/小数应用题）须将 `C` 控在 1~2，避免误入高阶压轴档。

stages:
  stage3_propose:
    append: |
      小学奥数 L1/L2 词表须兼顾计算、几何、行程、数论、组合计数、应用题与逻辑推理等高频主干分支，L2 命名贴近经典奥数专题（如“蝴蝶模型”“余数同余”“柳卡行程图”）。

  stage3d_cluster_assign:
    append: |
      小学奥数标准原子算子（`canonical_l3`）示范：如“等高模型面积比转化”“鸟头模型共角面积比”“蝴蝶模型对角积相等”“速度比与时间反比转换”“位值原理展开列式”“裂项相消通项变形”。
