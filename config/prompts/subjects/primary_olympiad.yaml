schema_version: 1
grade_subject: "小学奥数"
slug: "primary_olympiad"

blocks:
  persona:
    append: |
      小学奥数竞赛与杯赛核心教研设定：
      你精通小学奥数七大核心模块体系（计算与代数巧算、典型应用题、行程问题、平面与立体几何、数论、计数与组合、逻辑推理与杂题），熟悉算术思维与初等模型化归，拒绝在面向学生的教学解答中用超纲高等工具替代本学段核心思维训练。

  visual_extraction:
    append_file: "snippets/primary_olympiad_visual_and_hint_examples.md"

  solving_conventions:
    append: |
      小学奥数专有求解约定：
      - **教学解法工具边界**：`solution_markdown` 与 `steps` 优先采用份数法、比例转化、假设法、逆推还原、设而不求、一元一次方程与简单多元一次消元、五大平面几何面积模型（等高/鸟头/蝴蝶/燕尾/沙漏金字塔）、勾股与弦图割补、容斥/抽屉/加乘计数、位值与同余周期；**严禁在教学解答中使用解析几何坐标建系、三角函数（`sin/cos/tan`）、一元二次方程求根公式、微积分或初等几何全等/相似形式化证明符号降维打击**（但 `sympy_code` 后台验算脚本不受此限，可自由建系或列方程组验真）。
      - **圆周率与分数细节**：题干明示“π 取 3.14”（或 `22/7`）时按指定近似值计算，并在 `sympy_code` 中使用 `Rational(314, 100)` 等精确有理数避免浮点尾差；题干未明示近似值时一律保留精确符号 `pi`。

  steps_and_socratic_hint:
    append_file: "snippets/primary_olympiad_l3_examples.md"

  abstraction_and_tagging:
    append_file: "snippets/primary_olympiad_concepts_guide.md"

  difficulty_rubric_notes:
    append: |
      小学奥数难度标尺校准专则：
      - **`C=4` 果断给分判据**：凡需无提示自主构造旋转/翻折全等拼合（如弦图外接或内嵌旋转极值）、构造染色或奇偶/同余不变量反证、构造双边极端放缩界值并同时给出可行构造例、或深层数论递推构造，即果断评为 `C=4`（无需达到中学联赛难度）。
      - **繁算与应用题防错档**：多过程分段行程、复杂分数经济浓度题若仅按部就班列式繁算而无非标洞察，应体现为 `C=2, S=3, L=3`（落入 `L4-A_进阶拔高(繁)`），不得把纯繁琐单模型题抬入 `C>=3`；同时必须按小学奥数最优标准解法打分，严禁用笨办法硬枚举虚抬 `S` 或 `L`。

stages:
  stage3_propose:
    append: |
      小学奥数主干架构锚定：
      L1 须锚定小学奥数公认主干分支（如计算与代数巧算、典型应用题、行程问题、平面几何、立体几何、数论、计数与组合、逻辑推理与杂题），L2 命名贴合公认奥数专题模型（如“等高与鸟头模型”“蝴蝶与燕尾模型”“柳卡图与比例行程”“整除与余数同余”“位值原理与数字谜”），严禁设立跨模块交叉伪 L1。

  stage3d_cluster_assign:
    append: |
      小学奥数归并示范：
      - 同域 L3 标准算子示范：`等高模型面积比转化`、`鸟头共角面积比转化`、`蝴蝶模型对角积转化`、`速度比与时间反比转换`、`位值原理展开消元`、`裂项相消通项变形`；
      - `全局概念 / MOTIF` 归一示范：`鸡兔同笼变式`/`三元鸡兔同笼`/`鸡兔同笼模型` 统一归并为 `鸡兔同笼`；`牛吃草变式`/`漏水牛吃草` 统一归并为 `牛吃草问题`；
      - `全局概念 / METHOD` 归一示范：`整体代换法`/`整体代入` → `整体代换`；`设数代入法`/`赋值法` → `设数赋值`。
