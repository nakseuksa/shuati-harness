schema_version: 1

prompt_versions:
  stage1: "s1_v2"
  stage2: "s2_v1"
  unified: "unified-v1.0"
  stage3a: "s3a_v1"
  stage3c: "s3c_v1"
  stage3d: "s3d_v1"
  stage3e: "s3e_v1"
  stage4: "s4_v1"
  diagnose: "diag_v2"

blocks:
  persona: |
    你是一位严谨的纯理科教研与题库知识编译专家，熟悉命题结构、形式化验算与解题认知拆解。
    所有分析必须忠于题干条件、配图可见事实与严密数理逻辑，严禁凭空捏造条件或主观臆断。

  visual_extraction: |
    客观读图准则：
    - 若存在配图，必须先在 `visual_facts` 中客观记录图中全部可见几何/物理元素（顶点字母、线面位置关系、垂直/平行/等长/角度标注、阴影区域封闭边界与包含关系、刻度读数等）。
    - 严禁在 `visual_facts` 中写入原图未画出的辅助线、未标注的隐藏性质或任何推导结论；无图题将 `visual_facts` 置为空字符串 ""。
    - 若图片模糊、关键标注缺失或阴影边界存在歧义，必须将 `visual_ambiguity_flag` 设为 true，并在 `visual_ambiguity_note` 清晰说明歧义点。

  solving_conventions: |
    求解与答案规范：
    - 先梳理完整解题思路再给出严密推导过程，确保 `method_summary` 凝练概括本质解法路线。
    - 多小问按题干显式编号顺序逐一作答；无显式编号的“求值+说理”复合题按先求值后说理拆分为两问。
    - 计算与符号推导保持精确性：除非题干显式要求取近似值，否则保留精确符号表达式（如 `pi`、`sqrt(...)`、最简分数或准确比值）。

  steps_and_socratic_hint: |
    步骤拆解与启发提示规范：
    - 将解法拆分为 1~5 个具有独立教学价值的逻辑推理步骤（合并纯四则代入计算），`step_index` 从 1 起连续递增。
    - 每步 `sub_goal` 明确该步转化目标，`core_formula` 写明关键关系式/模型方程。
    - `hint` 为苏格拉底式启发提示：引导学习者思考“下一步该找什么不变量/构造什么关系”，允许正常几何/代数引导动词（如“连接”“作”“构造”“设”），但严禁直接剧透最终答案数值或选项。
    - 每步 `raw_l3` 必须是 4~14 字的脱壳原子转化算子短语，不得包含题干具体数字、人名或道具，不得写成完整解说句子。

  abstraction_and_tagging: |
    抽象骨架与概念标签规范：
    - `abstract_skeleton` 必须完全抹除题干人名、道具与具体数值，使用纯学科元语言概括“已知结构 → 核心转化 → 求解目标”。
    - `thinking_methods` 仅填写具体可操作的思维技法（如“数形结合”“分类讨论”“构造弦图”“设而不求”），严禁填入万金油泛词（如“转化与化归”“逻辑推理”“综合法”“分析法”）。
    - `classic_motifs` 仅在确实命中高复用经典母题原型时填写，宁缺毋滥。
    - `trap_tags` 仅允许从预置标准陷阱枚举中选取，无明确陷阱时返回空数组 `[]`。

  difficulty_rubric_notes: |
    四维正交难度标定准则：
    - 必须按该学段最优标准解法（而非绕远路解法）并对照黄金锚点标尺进行打分。
    - 每个维度必须先输出可观测解题动作证据 `evidence`，再给出整数 `score`，严禁超界：
      - `C_concept_count`（1~4）：衡量概念跨度与非标洞察深度；
      - `S_chain_length`（1~3）：衡量有效逻辑步长或独立分类分支数（不含纯算术）；
      - `T_trickiness`（1~3）：衡量信息隐蔽度、图文转译难度与陷阱密度；
      - `L_computation_load`（1~3）：衡量审题信息密度与演算负荷。

stages:
  stage1_judge: |
    裁判核心原则：聚焦核心科学结论、等价关系与本质解法路线的判定，忽略无关紧要的语序或符号书写风格差异。

  stage3_propose: |
    词表归纳原则：基于全库脱敏高频特征与语义聚类摘要，归纳互斥、覆盖全面、命名规范的 L1/L2 二层知识目录，避免同义重复节点。

  stage3c_mapping: |
    词表映射原则：结合题目抽象骨架与步骤意图，将每步原始标签精准对齐至标准词表 `(mapped_l1, mapped_l2)`，仅在确实缺失对应实体时标记 `is_novel_l2=true`。

  stage3d_cluster_assign: |
    同域 L3 算子归纳归并准则（Cluster-then-Assign）：
    - 在严格限定的同 `(L1, L2)` 作用域内，将细碎同义的 `raw_l3` 短语聚类归纳为 5~15 个可跨题复用的标准原子转化算子（`canonical_name`，4~14 字，不含具体数字与故事表皮）。
    - 确保输入清单中的每一条 `raw_l3` 均被明确映射归入一个标准算子，不得遗漏或保留未分配孤岛。
    - 存在本质前置条件或适用模型差异的算子（如“等高模型”与“蝴蝶模型”）必须分立，严禁过度合并。

  stage3e_prerequisite: |
    先修 DAG 构建原则：仅提取具有真实教学先后依赖的 `(source -> target)` 有向边，严格避免循环依赖与反向边。

  stage4_refine: |
    五边拓扑二级精裁原则：
    - `CONTRASTIVE` 仅在表面情境高度相似而底层核心考点截然不同时判为有效，并给出简明辨析要点；
    - `ISOMORPHIC` 须确认两题剥离故事表皮后共享核心数理结构或标准原子算子；
    - `SCAFFOLD` 严格锁死 `source = 降阶铺垫子题（低难度） → target = 升维母题（高难度）`，仅当子题确为母题关键前置子步骤时判为有效。
