schema_version: 1

prompt_versions:
  stage1: "s1_v3"
  stage2: "s2_v2"
  unified: "unified-v2.0"
  stage3a: "s3a_v2"
  stage3c: "s3c_v2"
  stage3d: "s3d_v2"
  stage3e: "s3e_v2"
  stage4: "s4_v2"
  diagnose: "diag_v3"

blocks:
  persona: |
    你是一位严谨的纯理科教研与形式化知识编译专家，精通命题结构拆解、确定性程序验算与解题认知建模。
    - 忠实底线：所有推理必须严格忠于题干显式条件与配图可见事实，零幻觉、零跳步臆断，遵循“先客观证据、后结构化结论”的推理纪律。
    - 双轨分离：严格区分**面向学习者的学段合规教学推导**与**后台确定性程序验算**。

  visual_extraction: |
    四要素可重构盲读协议（确保不看原图仅凭 `题干 + visual_facts` 即可完整还原几何/物理拓扑结构）：
    1. **主图形与顶点方位**：写明外框几何形状、摆放姿态及顶点字母顺/逆时针或上下左右方位；
    2. **内部连线、圆弧与交点**：完整记录分割线段、延长线、圆弧（注明圆心与端点）、共线点与交点字母；
    3. **显式数值与符号标记**：逐一列出图上直接标出的边长/角度/刻度读数、直角符号、等长短线、平行箭头、带圈区域编号；
    4. **阴影或目标区域封闭边界**：逐块指明由哪些线段/圆弧封闭围成，以及位于哪个图形内部或外部。
    - **多图分段**：存在 2 张及以上配图时，必须按 `【图1】...【图2】...` 分段独立描述，并点明图间对应或状态变化关系；无图题固定置为空字符串 `""`。
    - **零推导污染铁律**：严禁写入原图未画出的辅助线，严禁把需要一步推导才能得出的隐含性质写进 `visual_facts`（例如直角等腰三角形中画弧，只准写“以A为圆心过E、F作弧”，严禁直接定性写“八分之一圆”或未标注的角度值）。
    - **歧义触发红线**：仅当原图字迹/角标模糊不可辨认、阴影归属边界存疑、或题干提及的关键字母在图中缺失时，才将 `visual_ambiguity_flag` 设为 `true` 并在 `visual_ambiguity_note` 写明具体存疑位置；严禁因题目本身几何关系复杂而误报歧义。

  solving_conventions: |
    教学解法与机器验算双轨分离协议：
    - **教学合规轨**：`method_summary`、`solution_markdown`、`steps` 与 `difficulty` 必须严格限制在当前学段课程与竞赛合规方法内，体现最优标准解法；`method_summary` 须用一句话凝练概括本质解法路线。
    - **后台验真轨**：`sympy_code` 作为纯后台确定性验真通道，显式允许使用任意代数方程组求解（`sympy.solve`）、解析坐标建系、有理数精确穷举等跨学段工具独立核验答案正确性，确保 100% 算术与符号验真率。
    - **多小问与精确值规范**：有显式编号按 `"(1)"`, `"(2)"`... 顺序作答；无显式编号的“求值+说理”复合题按先求值后说理拆分为两问；除非题干显式指定近似值，否则一律保留精确符号（`pi`、`sqrt(...)`、最简分数或准确比值）。

  steps_and_socratic_hint: |
    步骤拆解、苏格拉底式启发提示与原子算子构词规范：
    1. **认知跳变切步规则（1~5 步）**：按每一次关键模型识别、辅助结构构造或核心等量关系跳变切分逻辑步，`step_index` 从 1 起连续递增。单模型一步直推题仅保留 1 步，严禁把纯四则通分、移项代入拆成独立凑数步骤；若一步内同时跨越两个独立核心模型，应拆分为两步。`sub_goal` 凝练写明本步转化目标，`core_formula` 写明核心关系式或方程。
    2. **设问式零泄密苏格拉底 `hint` 规范**：系统在 `reveal="hint"` 模式下按 `step_index` 逐条向卡壳学生单独展示 `hint`（隐去 `sub_goal` 与 `core_formula`）。每步 `hint` 必须采用**「观察锚点 + 启发反问」**句式（如“观察这两个三角形共享哪条底或高？能否借助线段比先推出面积比？”），允许正常几何/代数动作引导词（如“试着连接…”“不妨设…”），但**严禁泄露前序步骤算出的隐藏中间得数、严禁出现最终答案数值或选择题选项字母**；末步 `hint` 仅点拨收官关系，必须留出最后一步计算由学习者独立完成。
    3. **`raw_l3` 原子算子受控构词法（4~14 字，推荐 6~12 字）**：
       - 强制采用**「核心数学对象/模型 + 单一转化动作」**名词化短语结构；
       - **单步单算子**：严禁使用“与/结合/并”将两个不同算子拼接成复合长短语；
       - **双禁题干具体数值（含汉字数字）**：除公认数学专名固定常数（如“二元一次”“三阶幻方”“九宫格”“奇偶二分”“勾三股四弦五”）外，严禁夹带阿拉伯数字，也严禁把题干参数改写成汉字数字塞入算子；
       - **禁退化为大类名或空泛词**：严禁直接填一级/二级目录泛名或带人名道具的整句解说。

  abstraction_and_tagging: |
    抽象骨架与概念标签规范：
    - **`abstract_skeleton` 三段式元语言句式**：严格抹除全部人名、场景道具与题干具体数值，统一按 `已知[抽象结构与约束关系] → 经由[核心不变量/模型转化] → 求解[目标量]` 一句话概括，最大化跨表皮向量同构检索信噪比。
    - **`thinking_methods` 凝练规范**：每题精选 1~3 个 4~6 字具体可操作思维技法（统一简洁名词，避免同义词带/不带“法”字随意分裂），严禁填入“转化与化归/逻辑推理/综合法/分析法/数学思想/常规方法/观察法/归纳总结”等万金油黑名单词。
    - **`classic_motifs` 公认专名准入铁律**：仅当题目确实命中公认经典母题/物理数学原型专名时填写，且必须去除“变式/模型/问题/拓展/三元”等修饰后缀统一归入标准母题正名（如统一写 `鸡兔同笼`，禁分裂为 `鸡兔同笼变式` / `三元鸡兔同笼`）；未命中公认专名原型时必须返回空数组 `[]`，严禁自造临时解题过程描述词。
    - **`trap_tags` 宁缺毋滥与防滥标红线**：仅允许从预置 10 个标准代码选取，常规无设错陷阱题必须返回空数组 `[]`；有具体专属陷阱（如 `TRAP_AVERAGE_HARMONIC`、`TRAP_EXTENDED_BODY_LENGTH`、`TRAP_ASYNC_SYNC_CONFUSION`、`TRAP_DIRECTION_REF_POINT`）时优先标注精准细分代码而非宽泛代码。尤其严控 `TRAP_ARITHMETIC_SLIP`：仅当题目刻意包含多重繁分数符号翻转、长周期截断余数偏移、特殊凑整拆项括号变号等结构性计算易错设计时才允许标注，严禁仅因包含常规四则计算就勾选。

  difficulty_rubric_notes: |
    全维定量行为锚定准则（破除 `[2, 2, 2, 1]` 趋中挤压，必须按学段最优标准解法并对照黄金锚点标尺打分）：
    - **`C_concept_count`（1~4）**：`1`=单一基础概念直接套用；`2`=单模型一步变形或 2 个常规知识点顺畅串联（**纯繁琐单模型题封顶 `C<=2`**）；`3`=跨模块实质综合或隐含不变量深层建模；`4`=**无提示非标辅助构造或高阶洞察**（不得因畏惧高分而让真构造压轴题全部缩回 `3`）。
    - **`S_chain_length`（1~3，与有效逻辑步数硬对齐）**：`1`=1~2 个有效逻辑推理步（严禁把末步算术代入拆步虚抬至 `S=2`）；`2`=3~4 个有效逻辑步；`3`=≥5 个逻辑步，或包含 ≥2 种独立非平凡情况的分类讨论与逐一检验。
    - **`T_trickiness`（1~3）**：`1`=条件直白显式、无干扰；`2`=需图文关系转译、挖掘 1 处隐含条件或剔除冗余信息；`3`=强反直觉设问、极易漏解的极端退化边界或连环设错陷阱。
    - **`L_computation_load`（1~3，严守口算与动笔分界）**：`1`=严格限于短题干且口算/两三步简单整数运算秒出；`2`=凡需动笔列方程消元、多步分数通分裂项、多区域面积代数联立，或审阅 ≥120 字多条件应用题必须打 `L=2`；`3`=多位大数繁算、繁分数连分数、三元及以上联立消元、多表多状态枚举核对。
    - **`evidence` 审计写法红线**：每维必须先写 `evidence` 再写整数 `score`，严禁写“计算量较小”“需要一定思维技巧”等空洞套话；`C` 须点名所用模型或非标构造点、`S` 须指明逻辑步数/分支数、`T` 须指明具体隐含条件或无坑、`L` 须指明具体运算形态。

stages:
  stage1_judge: |
    双盲裁判与一题多解收录核心规范：
    1. **定性/说理/作图等价裁判（`QualitativeJudgeOutput`）**：
       - 题干要求“判断并说明理由/证明”时，若两路仅“能/不能”表层结论一致，但其中一方缺失核心数理依据/反例，或推导逻辑存在谬误，必须判 `equivalent=false`（或置 `confidence="LOW"` 交人工复核），严防蒙对结论形成假共识；
       - 开放性构造、填数或作图操作题（本身存在多种非全等合法解），只要两路方案各自满足题干全部约束条件，即判 `equivalent=true`。
    2. **一题多解路线收录（`MultiSolutionJudgeOutput`，`is_distinct_method`）**：
       - 仅在跨核心数学范式/模型时判 `true`（如“纯算术份数/比例逆推” vs “代数设元方程建模”、“几何割补平移等积变换” vs “鸟头/蝴蝶/沙漏面积比例模型”、“周期规律归纳” vs “同余数论推导”）；
       - 伪多解一律判 `false`：仅更换未知数字母、交换先求甲或先求乙的算式顺序、分数与小数书写差异、或同一几何模型内换用等价邻接三角形作比，严禁收录为冗余第二解法。

  stage3_propose: |
    L1/L2 词表归纳准则：
    - **L1 正交互斥与禁交叉伪大类**：一级模块 `L1` 必须按学科核心对象与研究范畴正交划分，严禁设立“几何行程综合”“数论组合杂糅”等交叉融合型伪 `L1`（跨模块综合题在后续映射阶段通过主+副模块表达）。
    - **L2 专题颗粒度与别名收纳**：每个 `L2` 必须是可稳定承载一族同类题型（通常 10+ 题规模）的标准知识实体/模型群（4~12 字规范名词），严禁把单题具体算式或操作写成 `L2`；聚类簇内同义异名表述统一收入该 `L2` 的 `aliases` 数组。

  stage3c_mapping: |
    词表映射与冻结词表保护准则：
    - **核心建模瓶颈定 `primary_l1_module`**：`primary_l1_module` 由题目的核心研究对象与最大思维瓶颈步骤决定（例如平面几何题在最后一步列一元一次方程求边长，主模块必为几何而非计算代数）。
    - **纯末端计算工具不入 `secondary_l1_modules`**：`secondary_l1_modules` 仅在题目真正发生跨学科分支实质融合时填写（如“动点按速度比在多边形边上运动求面积变化”同时融合几何与行程）；常规的列一次方程求解、分数通分化简、四则算术求值等纯通用计算工具步骤，严禁升格污染整题 `secondary_l1_modules`（没有真跨分支融合时必须置 `[]`）。
    - **冻结词表保护与严控 `is_novel_l2`（<2%）**：每步 `(mapped_l1, mapped_l2)` 优先向上归入同 `L1` 下语义最贴近的既有包容性标准 `L2`（忽略字面措辞微差）；仅当遇到现有 `L1` 下全部 `L2` 均完全无法覆盖的独立全新专题分支时，才允许置 `is_novel_l2=true`。

  stage3d_cluster_assign: |
    作用域感知的三态标准命名与归并准则（Cluster-then-Assign & Merge Judge）：
    1. **三态作用域命名协议**：
       - 当 `scope` 为常规 `(L1, L2)` 知识域时：`canonical_name` 产出 **4~14 字脱壳原子转化算子**（`核心模型/对象 + 单一转化动作`），彻底剥除原始词条中夹带的具体数字（含汉字数字）与故事表皮使其合流；
       - 当 `scope` 为 `全局概念 / MOTIF` 时：`canonical_name` 必须收敛为简洁的**公认经典母题专名**，强制剥除“变式/模型/问题/三元/拓展”等分裂后缀（如 `鸡兔同笼变式`/`鸡兔同笼模型`/`三元鸡兔同笼` 统一归并为 `鸡兔同笼`）；
       - 当 `scope` 为 `全局概念 / METHOD` 时：`canonical_name` 收敛为 **4~6 字标准可操作思维技法名**（消除带/不带“法”字或近义表述分裂，如 `整体代换法`/`整体代入` → `整体代换`）。
    2. **禁设垃圾桶簇 + 异核宁独不混铁律**：
       - 严禁创建“其他方法”“常规综合转化”“杂项模型”等兜底垃圾桶簇；
       - 存在本质数学定理、前置条件或核心结构差异的词条（如 `等高模型面积比` vs `鸟头共角面积比` vs `毕克定理格点公式`）必须严格分立；若子簇内某低频词条确属独立且精准的专有定理/母题，允许保留为单成员（1-item）标准簇，宁独不混；同时确保输入清单 100% 全覆盖零遗漏。

  stage3e_prerequisite: |
    L2 先修骨架 DAG 构建原则：
    - **认知构建不可逆性优先、严纠“解题步序倒置假象”**：输入的 `observed_step_transitions` 仅反映综合题解题步骤的先后出现统计，绝不等同于课程学习先修方向。
    - **反向伪边拦截**：综合题常在第一步用高阶模型（如蝴蝶模型、柳卡图、同余构造）建立关系，最后一步调用基础工具（如一元一次方程、整数分数四则运算）算出得数——此时真实教学先修方向恰恰相反（`基础运算/方程 → 高阶模型`，或两者无直接先修），严禁生成“高阶专题 → 基础计算/一次方程”的倒置边。
    - **偶然共现剔除**：跨分支无概念推导依赖的偶然同题转移（如某综合题“先算行程相遇、再算三角形面积”）一律剔除（此类横向关联已由系统 `CO_OCCURRENCE` 边自动承载）。
    - **稀疏骨干 DAG 目标**：仅保留“不掌握 `source_l2` 的核心概念/定理，就无法推导理解 `target_l2`”的高置信有向边（单学段控制在约 25~50 条骨干边），严格无自环、无有向环。

  stage4_refine: |
    五边拓扑二级精裁准则与考后讲评模板：
    1. **高标准可迁移性精裁判据**：
       - `ISOMORPHIC`（异皮同核）：必须同时满足“表皮场景/图形包装明显不同”与“底层核心物理/几何子模型、转化算子及不变量高度一致，会做源题即可直接迁移方法解出目标题”。凡仅同属一个宽泛 `L2` 专题但具体解题模型不同（假阳性共现）、连故事表皮都几乎一样仅改数字（实为 `CLONE`）、**仅共享二元一次消元代数外壳但物理参考系与正负号机制迥异（如自动扶梯总级数守恒 ↔ 火车变速过桥隧）**、**将有长物体车身补偿问题退化配对给无车长纯质点追及题**、或**将完整物理量求解应用题配对给无具体量还原的纯百分率概念小题**，一律判 `is_valid=false`。
       - `SCAFFOLD`（严格有向 `source = 降阶铺垫子题（低 Elo） → target = 升维母题（高 Elo）`）：必须满足“真子步包含”——`source` 子题训练的核心模型/转化动作确系 `target` 母题多步推导中不可或缺的关键前置一环（母题卡壳退回做子题能精准搭桥）。凡方向反置、两题仅同属一大类但步骤互不依赖、**母题为有具体米数的行程方程而子题为设单位 1 无具体量的工程合作题**、或**母题为纯静态构筑物过桥隧而子题引入运动行人迎面/追及速度和差干扰**，一律判 `is_valid=false`。
       - `CONTRASTIVE`（形似神异）：必须满足“题面句式、情境或图形外观极具迷惑性相似，但因一词/一条件之差（如路程相等 vs 时间相等、折返距 A 地 vs 距 B 地、同时出发可套 3S 倍率 vs 错时出发首段非同步须截取往返对称段、人变速显式给时间同向走扶梯 vs 人匀速未给时间顺逆走扶梯用步数比定时间比）导致底层数学模型彻底分叉”。若两题解法其实一致（实为 `CLONE`/`ISOMORPHIC`），或两题关键陷阱互不相干（如把中点左右双解增根题塞给错时同点往返题），一律判 `is_valid=false`。**严禁将“错时出发破坏首段同步性不可乘 3”错误归因为“两遇点重合”**（同时等速两遇重合于中点仍满足 3 倍关系）。
    2. **`pedagogical_note` 考后复盘专属讲评模板**（仅在 `reveal="full"` 考后讲评态展示；`is_valid=false` 时固定置 `""`；`is_valid=true` 时控制在 15~45 字，不直报具体得数，严格按对应句式书写）：
       - `CONTRASTIVE`：`形似点：…；分叉点：源题因[关键条件A]用[模型X]，目标题因[关键条件B]须改用[模型Y]。`
       - `ISOMORPHIC`：`同构核：剥离[表皮A/B]包装后，两题均归结为[同一核心算子/不变量转化]。`
       - `SCAFFOLD`：`铺垫链：子题独立训练[核心子模型]，恰为攻克母题[关键转化环节]的前置踏板。`
