llm:
  vlm_primary:
    base_url: "${VLM_PRIMARY_BASE_URL:-https://api.openai.com/v1}"
    api_key: "${VLM_PRIMARY_API_KEY:-}"
    model: "${VLM_PRIMARY_MODEL:-gemini-2.5-pro}"
    temperature: 0.1
    timeout_seconds: 180
    max_concurrency: 4
    rpm_limit: 30
    max_retries: 3
  vlm_secondary:
    base_url: "${VLM_SECONDARY_BASE_URL:-https://api.openai.com/v1}"
    api_key: "${VLM_SECONDARY_API_KEY:-}"
    model: "${VLM_SECONDARY_MODEL:-claude-3-7-sonnet}"
    temperature: 0.1
    timeout_seconds: 180
    max_concurrency: 4
    rpm_limit: 30
    max_retries: 3
  text_llm:
    base_url: "${TEXT_LLM_BASE_URL:-https://api.openai.com/v1}"
    api_key: "${TEXT_LLM_API_KEY:-}"
    model: "${TEXT_LLM_MODEL:-deepseek-chat}"
    temperature: 0.1
    timeout_seconds: 120
    max_concurrency: 12
    rpm_limit: 120
    max_retries: 3
  judge_llm:
    base_url: "${JUDGE_LLM_BASE_URL:-}"
    api_key: "${JUDGE_LLM_API_KEY:-}"
    model: "${JUDGE_LLM_MODEL:-}"
    temperature: 0.0
    timeout_seconds: 60
    max_concurrency: 8
    rpm_limit: 120
    max_retries: 3
  embedding:
    provider: "openai_compatible"
    base_url: "${EMBEDDING_BASE_URL:-https://api.openai.com/v1}"
    api_key: "${EMBEDDING_API_KEY:-}"
    model: "${EMBEDDING_MODEL:-text-embedding-3-large}"
    batch_size: 32
    timeout_seconds: 60.0
    max_concurrency: 8
    rpm_limit: 120
    max_retries: 3

pipeline:
  dual_vlm_policy: "always"
  sympy_timeout_seconds: 5.0
  enable_stage4_llm_refine: true
  use_mock_llm: false
  max_stage_attempts: 3
  sympy_memory_limit_mb: 512
  consensus_audit_ratio: 0.05
  max_external_image_px: 2048
  allow_pi_314_subjects:
    - 小学奥数

timezone: "Asia/Shanghai"

learner_elo:
  initial: 1300
  k_provisional: 48
  k_stable: 24
  provisional_attempts: 10
  hint_score: 0.5
  repeat_within_days: 7
  secondary_l1_weight: 0.5

composer:
  exclude_solved_days: 60
  exclude_clone_days: 14
  exclude_recent_quiz_batches: 3

topology:
  rule_version: "2.4-init"
  expected_degree:
    CLONE: [0, 1]
    ISOMORPHIC: [1, 5]
    SCAFFOLD: [1, 6]
    CONTRASTIVE: [0, 2]
    SHARED_TRAP: [0, 5]
  thresholds:
    clone:
      knn_k: 3
      surface_pct: 0.995
      surface_sim_min: 0.85
      skeleton_pct: 0.995
      skeleton_sim_min: 0.88
      max_elo_diff: 120
      degree_cap: 5
    isomorphic:
      knn_k: 10
      skeleton_pct: 0.95
      skeleton_sim_min: 0.76
      surface_pct_max: 0.60
      k_jaccard_min: 0.20
      max_elo_diff: 180
      boundary_band: 0.10
      degree_cap: 8
    scaffold:
      min_k_size: 2
      containment_min: 0.40
      reverse_containment_max: 0.60
      min_elo_diff: 200
      skeleton_pct_min: 0.90
      boundary_band: 0.10
      in_degree_cap: 5
      out_degree_cap: 5
    contrastive:
      knn_k: 10
      surface_pct_min: 0.98
      k_jaccard_max: 0.35
      degree_cap: 5
    shared_trap:
      min_shared: 1
      idf_overlap_min: 0.65
      skeleton_pct_max: 0.60
      cross_l1_bonus: 1.3
      degree_cap: 5

human_mirror:
  dir: "human/"
  include_practice_log: true
  backups_keep: 10

ingest:
  roots:
    - "题库"
  dedup_near_default: true

subagent:
  default_model: "${SUBAGENT_DEFAULT_MODEL:-gemini-4-neon-medium}"
  max_parallel_workers: 4
  stage_models: {}
