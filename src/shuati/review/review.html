<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shuati Harness — 本地键盘复核台</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-alt: #162032;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --ok: #22c55e;
    --warn: #f59e0b;
    --err: #ef4444;
    --diff-bg: rgba(239, 68, 68, 0.16);
    --diff-border: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    gap: 12px;
    flex-shrink: 0;
  }
  .hdr-left, .hdr-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--panel-alt);
  }
  .badge.warn { border-color: var(--warn); color: #fcd34d; background: rgba(245,158,11,0.12); }
  .badge.err { border-color: var(--err); color: #fca5a5; background: rgba(239,68,68,0.14); }
  .badge.ok { border-color: var(--ok); color: #86efac; background: rgba(34,197,94,0.14); }
  .badge.accent { border-color: var(--accent); color: #7dd3fc; }
  .uid { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; color: var(--accent); }
  main {
    display: grid;
    grid-template-columns: 42% 58%;
    flex: 1;
    min-height: 0;
  }
  .pane {
    overflow-y: auto;
    padding: 14px 16px;
    border-right: 1px solid var(--border);
  }
  .pane:last-child { border-right: none; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .card h3 {
    margin: 0 0 8px 0;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stem { white-space: pre-wrap; line-height: 1.65; font-size: 15px; }
  .options-list { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 14px; }
  .opt-item { background: var(--panel-alt); padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); }
  .img-gallery { display: flex; flex-direction: column; gap: 10px; }
  .img-block { background: #0b1220; border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
  .img-caption { font-size: 12px; font-weight: 600; color: #7dd3fc; margin-bottom: 6px; }
  .img-wrap { overflow: auto; max-height: 360px; text-align: center; cursor: zoom-in; }
  .img-wrap.zoomed { cursor: zoom-out; }
  .img-wrap img { max-width: 100%; height: auto; transition: transform 0.15s ease; transform-origin: top left; }
  .img-wrap.zoomed img { max-width: none; transform: scale(1.75); }
  .dual-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .col-box { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .col-title { font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
  pre, code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    background: #0b1220;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    white-space: pre-wrap;
    word-break: break-word;
    margin: 0;
  }
  .sol-md { white-space: pre-wrap; line-height: 1.55; font-size: 13.5px; color: #cbd5e1; }
  table.parts { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 4px; }
  table.parts th, table.parts td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
  table.parts th { background: var(--panel-alt); color: var(--muted); font-weight: 600; }
  tr.row-diff { background: var(--diff-bg); }
  tr.row-diff td:first-child { border-left: 3px solid var(--diff-border); }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 8px 16px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .btn-group { display: flex; flex-wrap: wrap; gap: 8px; }
  button {
    background: var(--panel-alt);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 11px;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: #fff; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { border-color: #0284c7; background: rgba(2,132,199,0.2); }
  button.danger { border-color: #b91c1c; background: rgba(185,28,28,0.18); }
  button.success { border-color: #16a34a; background: rgba(22,163,74,0.2); }
  kbd {
    background: #0b1220;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 11px;
    font-family: ui-monospace, monospace;
    color: var(--accent);
  }
  .editor-panel {
    display: none;
    background: #131c2e;
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .editor-panel.open { display: block; }
  .field-row { margin-bottom: 10px; }
  .field-row label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  textarea, input[type="text"] {
    width: 100%;
    background: #0b1220;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
  }
  .toast {
    position: fixed;
    right: 18px;
    bottom: 58px;
    background: #0f172a;
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    display: none;
    z-index: 50;
  }
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    gap: 10px;
  }
</style>
</head>
<body>
<header>
  <div class="hdr-left">
    <strong>Shuati 复核台</strong>
    <span class="badge accent" id="queueCounter">0 / 0</span>
    <span class="uid" id="hdrUid">—</span>
    <span class="badge" id="hdrSubject">—</span>
    <span class="badge" id="hdrStatus">—</span>
    <span id="hdrReasons"></span>
  </div>
  <div class="hdr-right">
    <button id="btnUndo" title="撤销上一次提交 (U)"><kbd>U</kbd> 撤销上一笔</button>
    <button id="btnRefresh">刷新队列</button>
  </div>
</header>

<main id="mainGrid">
  <section class="pane" id="leftPane">
    <div class="card" id="imagesCard" style="display:none;">
      <h3><span>原图区（点击缩放）</span><span id="imgCountBadge"></span></h3>
      <div class="img-gallery" id="imgGallery"></div>
    </div>

    <div class="card">
      <h3><span>题干与选项</span><span id="fmtBadge" class="badge"></span></h3>
      <div class="stem" id="questionStem">加载中...</div>
      <div class="options-list" id="optionsBox"></div>
    </div>

    <div class="card">
      <h3><span>生效 visual_facts（几何/图形事实）</span></h3>
      <div class="sol-md" id="effVisualFacts">—</div>
    </div>
  </section>

  <section class="pane" id="rightPane">
    <div class="editor-panel" id="editorPanel">
      <h3 style="margin:0 0 10px 0;font-size:14px;color:var(--accent);display:flex;justify-content:space-between;">
        <span>人工编辑 &amp; [R] 重算参考草稿</span>
        <span id="resolveStatusBadge" class="badge">草稿未重算</span>
      </h3>
      <div class="field-row">
        <label>visual_facts（修正读图描述后可按 R 调用 text_llm 重算参考解答）</label>
        <textarea id="edVisualFacts" rows="4"></textarea>
      </div>
      <div class="field-row" style="display:flex;gap:8px;align-items:center;">
        <button id="btnResolve" class="primary"><kbd>R</kbd> 重算参考解答草稿</button>
        <span style="font-size:12px;color:var(--muted);" id="resolveSympyHint"></span>
      </div>
      <div class="field-row">
        <label>method_summary</label>
        <input type="text" id="edMethodSummary" />
      </div>
      <div class="field-row">
        <label>final_answers (JSON AnswerPart[])</label>
        <textarea id="edFinalAnswers" rows="5"></textarea>
      </div>
      <div class="field-row">
        <label>solution_markdown</label>
        <textarea id="edSolutionMd" rows="6"></textarea>
      </div>
      <div class="field-row">
        <label>sympy_code（可选）</label>
        <textarea id="edSympyCode" rows="4"></textarea>
      </div>
      <div style="display:flex;gap:8px;">
        <button id="btnSaveEdit" class="success">保存并定稿 (Ctrl+Enter)</button>
        <button id="btnCloseEdit">取消 (Esc)</button>
      </div>
    </div>

    <div class="card">
      <h3><span>逐小问答案对比与裁决</span><span id="verModeBadge" class="badge"></span></h3>
      <table class="parts">
        <thead>
          <tr>
            <th>小问</th>
            <th>主路 (PRIMARY)</th>
            <th>辅路 (SECONDARY)</th>
            <th>双盲 / SymPy / 备注</th>
          </tr>
        </thead>
        <tbody id="partsDiffBody"></tbody>
      </table>
    </div>

    <div class="dual-grid">
      <div class="col-box">
        <div class="col-title">
          <span>主路 PRIMARY</span>
          <span class="badge" id="pModelBadge">—</span>
        </div>
        <div id="pMetaBadges"></div>
        <div><strong>读图：</strong><div class="sol-md" id="pVisualFacts">—</div></div>
        <div><strong>思路：</strong><span id="pMethodSummary">—</span></div>
        <div><strong>解答：</strong><div class="sol-md" id="pSolutionMd">—</div></div>
        <div><strong>SymPy：</strong><pre id="pSympyCode">—</pre></div>
      </div>

      <div class="col-box">
        <div class="col-title">
          <span>辅路 SECONDARY</span>
          <span class="badge" id="sModelBadge">—</span>
        </div>
        <div id="sMetaBadges"></div>
        <div><strong>读图：</strong><div class="sol-md" id="sVisualFacts">—</div></div>
        <div><strong>思路：</strong><span id="sMethodSummary">—</span></div>
        <div><strong>解答：</strong><div class="sol-md" id="sSolutionMd">—</div></div>
      </div>
    </div>
  </section>
</main>

<footer class="toolbar">
  <div class="btn-group">
    <button id="btnAdoptPrimary" class="primary"><kbd>1</kbd> 采纳主路</button>
    <button id="btnAdoptSecondary" class="primary"><kbd>2</kbd> 采纳辅路</button>
    <button id="btnAdoptBoth" class="success"><kbd>B</kbd> 一题多解全采</button>
    <button id="btnToggleEdit"><kbd>E</kbd> 编辑 / 重算(<kbd>R</kbd>)</button>
    <button id="btnReconfirm"><kbd>K</kbd> 确认过期覆写仍有效</button>
    <button id="btnExclude" class="danger"><kbd>X</kbd> 坏题下架</button>
    <button id="btnSkip"><kbd>S</kbd> 暂跳过</button>
  </div>
  <div style="font-size:12px;color:var(--muted);">
    快捷键: 1 / 2 / B / E / R / X / S / K / U
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
const state = {
  queue: [],
  index: 0,
  currentItem: null,
  lastBundleId: null,
  busy: false,
};

function showToast(msg, isErr = false) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.borderColor = isErr ? "var(--err)" : "var(--accent)";
  el.style.display = "block";
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => { el.style.display = "none"; }, 2600);
}

async function apiGet(url) {
  const r = await fetch(url);
  const data = await r.json();
  if (!r.ok || !data.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

async function apiPost(url, body) {
  const r = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await r.json();
  if (!r.ok || !data.ok) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

function escapeHtml(str) {
  return String(str ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function formatPartAnswer(part) {
  if (!part) return "—";
  const ans = part.choice_label || part.canonical || part.answer || "";
  const unit = part.unit ? ` ${part.unit}` : "";
  const expr = part.sympy_expr ? ` [sym: ${part.sympy_expr}]` : "";
  return `${ans}${unit}${expr}`;
}

function renderItem(item) {
  state.currentItem = item;
  document.getElementById("queueCounter").textContent = `${state.index + 1} / ${state.queue.length}`;
  document.getElementById("hdrUid").textContent = `${item.source_id} (${item.question_uid})`;
  document.getElementById("hdrSubject").textContent = item.grade_subject;
  const stEl = document.getElementById("hdrStatus");
  stEl.textContent = item.eff_verification_status;
  stEl.className = "badge " + (item.eff_verification_status === "NEEDS_REVIEW" ? "warn" : "ok");

  const reasonsEl = document.getElementById("hdrReasons");
  reasonsEl.innerHTML = (item.review_reasons || [])
    .map(r => `<span class="badge err">${escapeHtml(r)}</span>`)
    .join(" ");

  document.getElementById("fmtBadge").textContent = item.eff_format;
  document.getElementById("verModeBadge").textContent = item.eff_verification_mode;
  document.getElementById("questionStem").textContent = item.eff_question_text || "";
  document.getElementById("effVisualFacts").textContent = item.eff_visual_facts || "（无）";

  // 选项
  const optsBox = document.getElementById("optionsBox");
  const opts = item.eff_options || {};
  const optKeys = Object.keys(opts).sort();
  optsBox.innerHTML = optKeys.length
    ? optKeys.map(k => `<div class="opt-item"><strong>${escapeHtml(k)}.</strong> ${escapeHtml(opts[k])}</div>`).join("")
    : "";

  // 多图显式编号与子图题注
  const imgs = item.cas_images || [];
  const caps = item.image_captions || [];
  const imgCard = document.getElementById("imagesCard");
  const gallery = document.getElementById("imgGallery");
  if (imgs.length > 0) {
    imgCard.style.display = "block";
    document.getElementById("imgCountBadge").textContent = `${imgs.length} 张`;
    gallery.innerHTML = imgs.map((fn, idx) => {
      const cap = caps[idx] ? `（${escapeHtml(caps[idx])}）` : "";
      const title = `配图 ${idx + 1}${cap}`;
      return `
        <div class="img-block">
          <div class="img-caption">${title}</div>
          <div class="img-wrap" onclick="this.classList.toggle('zoomed')">
            <img src="/assets/${encodeURIComponent(fn)}" alt="${title}" />
          </div>
        </div>
      `;
    }).join("");
  } else {
    imgCard.style.display = "none";
    gallery.innerHTML = "";
  }

  // 主/辅列
  const p = item.primary_run;
  const s = item.secondary_run;
  document.getElementById("pModelBadge").textContent = p ? `${p.model_name} (${p.run_status})` : "无";
  document.getElementById("pMetaBadges").innerHTML = p
    ? `<span class="badge ${p.sympy_status === 'PASSED' ? 'ok' : 'warn'}">SymPy: ${escapeHtml(p.sympy_status)}</span>`
      + (p.visual_ambiguity_flag ? ` <span class="badge err">读图存疑: ${escapeHtml(p.visual_ambiguity_note)}</span>` : "")
    : "";
  document.getElementById("pVisualFacts").textContent = p ? (p.visual_facts || "（无）") : "—";
  document.getElementById("pMethodSummary").textContent = p ? (p.method_summary || "—") : "—";
  document.getElementById("pSolutionMd").textContent = p ? (p.solution_markdown || p.error_message || "—") : "—";
  document.getElementById("pSympyCode").textContent = p && p.sympy_code ? p.sympy_code : "（无脚本）";

  document.getElementById("sModelBadge").textContent = s ? `${s.model_name} (${s.run_status})` : "无";
  document.getElementById("sMetaBadges").innerHTML = s && s.visual_ambiguity_flag
    ? `<span class="badge err">读图存疑: ${escapeHtml(s.visual_ambiguity_note)}</span>`
    : "";
  document.getElementById("sVisualFacts").textContent = s ? (s.visual_facts || "（无）") : "—";
  document.getElementById("sMethodSummary").textContent = s ? (s.method_summary || "—") : "—";
  document.getElementById("sSolutionMd").textContent = s ? (s.solution_markdown || s.error_message || "—") : "—";

  // 逐小问差异对比
  const pMap = new Map((p?.final_answers || []).map(x => [x.label, x]));
  const sMap = new Map((s?.final_answers || []).map(x => [x.label, x]));
  const vMap = new Map((item.part_verdicts || []).map(x => [x.label, x]));
  const labels = Array.from(new Set([...pMap.keys(), ...sMap.keys(), ...vMap.keys()]));
  const tbody = document.getElementById("partsDiffBody");
  tbody.innerHTML = labels.map(lb => {
    const pa = pMap.get(lb);
    const sa = sMap.get(lb);
    const vd = vMap.get(lb);
    const mismatch = (vd && (!vd.dual_equal || vd.sympy_ok === false)) || !pa || (s && !sa);
    const verdictTxt = vd
      ? `dual=${vd.dual_equal} | sympy=${vd.sympy_ok} ${vd.judge_note ? `(${vd.judge_note})` : ""}`
      : "—";
    return `
      <tr class="${mismatch ? "row-diff" : ""}">
        <td><strong>${escapeHtml(lb)}</strong></td>
        <td>${escapeHtml(formatPartAnswer(pa))}</td>
        <td>${escapeHtml(formatPartAnswer(sa))}</td>
        <td>${escapeHtml(verdictTxt)}</td>
      </tr>
    `;
  }).join("") || `<tr><td colspan="4">暂无小问数据</td></tr>`;

  // 预填编辑器
  document.getElementById("edVisualFacts").value = item.eff_visual_facts || p?.visual_facts || "";
  document.getElementById("edMethodSummary").value = p?.method_summary || "";
  document.getElementById("edFinalAnswers").value = JSON.stringify(
    item.eff_final_answers?.length ? item.eff_final_answers : (p?.final_answers || []),
    null,
    2
  );
  document.getElementById("edSolutionMd").value = p?.solution_markdown || "";
  document.getElementById("edSympyCode").value = p?.sympy_code || "";
  document.getElementById("resolveStatusBadge").textContent = "草稿未重算";
  document.getElementById("resolveSympyHint").textContent = "";

  // 按钮可用性
  document.getElementById("btnAdoptPrimary").disabled = !(p && p.run_status === "OK");
  document.getElementById("btnAdoptSecondary").disabled = !(s && s.run_status === "OK");
  document.getElementById("btnAdoptBoth").disabled = !(p && p.run_status === "OK" && s && s.run_status === "OK");
  document.getElementById("btnReconfirm").disabled = !(item.review_reasons || []).includes("OVERRIDE_STALE");
  document.getElementById("btnUndo").disabled = !state.lastBundleId;
}

function renderEmpty() {
  state.currentItem = null;
  document.getElementById("queueCounter").textContent = "0 / 0";
  document.getElementById("hdrUid").textContent = "队列已清空";
  document.getElementById("questionStem").textContent = "当前无待复核题目，可以关闭终端或刷新队列。";
  document.getElementById("partsDiffBody").innerHTML = "";
}

async function loadQueue(preferUid = null) {
  try {
    const data = await apiGet("/api/queue");
    state.queue = data.items || [];
    if (state.queue.length === 0) {
      renderEmpty();
      return;
    }
    if (preferUid) {
      const idx = state.queue.findIndex(x => x.question_uid === preferUid);
      state.index = idx >= 0 ? idx : 0;
    } else if (state.index >= state.queue.length) {
      state.index = 0;
    }
    await loadCurrentItem();
  } catch (e) {
    showToast("加载队列失败: " + e.message, true);
  }
}

async function loadCurrentItem() {
  if (!state.queue.length) {
    renderEmpty();
    return;
  }
  const uid = state.queue[state.index].question_uid;
  const data = await apiGet(`/api/item/${encodeURIComponent(uid)}`);
  renderItem(data.item);
}

async function doAdopt(role) {
  if (!state.currentItem || state.busy) return;
  state.busy = true;
  try {
    const res = await apiPost("/api/adopt", { question_uid: state.currentItem.question_uid, role });
    state.lastBundleId = res.result.bundle_id;
    showToast(`已采纳 ${role} (${res.result.bundle_id})`);
    await loadQueue();
  } catch (e) {
    showToast("采纳失败: " + e.message, true);
  } finally {
    state.busy = false;
  }
}

async function doExclude() {
  if (!state.currentItem || state.busy) return;
  state.busy = true;
  try {
    const res = await apiPost("/api/exclude", { question_uid: state.currentItem.question_uid });
    state.lastBundleId = res.result.bundle_id;
    showToast(`已下架题目 (${res.result.bundle_id})`);
    await loadQueue();
  } catch (e) {
    showToast("下架失败: " + e.message, true);
  } finally {
    state.busy = false;
  }
}

async function doReconfirm() {
  if (!state.currentItem || state.busy) return;
  state.busy = true;
  try {
    const res = await apiPost("/api/reconfirm", { question_uid: state.currentItem.question_uid });
    state.lastBundleId = res.result.bundle_ids?.[0] || null;
    showToast("已按当前指纹重签覆写");
    await loadQueue();
  } catch (e) {
    showToast("重签失败: " + e.message, true);
  } finally {
    state.busy = false;
  }
}

async function doUndo() {
  if (!state.lastBundleId || state.busy) return;
  state.busy = true;
  try {
    const res = await apiPost("/api/undo", { bundle_id: state.lastBundleId });
    const uid = res.result.question_uids?.[0] || null;
    showToast(`已撤销批次 ${state.lastBundleId}`);
    state.lastBundleId = null;
    await loadQueue(uid);
  } catch (e) {
    showToast("撤销失败: " + e.message, true);
  } finally {
    state.busy = false;
  }
}

async function doResolve() {
  if (!state.currentItem || state.busy) return;
  state.busy = true;
  document.getElementById("resolveStatusBadge").textContent = "重算中...";
  try {
    const vf = document.getElementById("edVisualFacts").value;
    const data = await apiPost("/api/resolve", {
      question_uid: state.currentItem.question_uid,
      visual_facts: vf,
    });
    const d = data.draft;
    document.getElementById("edMethodSummary").value = d.method_summary || "";
    document.getElementById("edFinalAnswers").value = JSON.stringify(d.final_answers || [], null, 2);
    document.getElementById("edSolutionMd").value = d.solution_markdown || "";
    document.getElementById("edSympyCode").value = d.sympy_code || "";
    document.getElementById("resolveStatusBadge").textContent = `草稿已就绪 (SymPy: ${d.sympy_status})`;
    document.getElementById("resolveSympyHint").textContent = d.sympy_output
      ? JSON.stringify(d.sympy_output)
      : "";
    showToast("已填充参考解答草稿，请确认后保存");
  } catch (e) {
    document.getElementById("resolveStatusBadge").textContent = "重算失败";
    showToast("重算失败: " + e.message, true);
  } finally {
    state.busy = false;
  }
}

async function doSaveEdit() {
  if (!state.currentItem || state.busy) return;
  let parsedAnswers;
  try {
    parsedAnswers = JSON.parse(document.getElementById("edFinalAnswers").value);
  } catch (e) {
    showToast("final_answers JSON 格式错误: " + e.message, true);
    return;
  }
  state.busy = true;
  try {
    const res = await apiPost("/api/edit", {
      question_uid: state.currentItem.question_uid,
      visual_facts: document.getElementById("edVisualFacts").value,
      method_summary: document.getElementById("edMethodSummary").value,
      final_answers: parsedAnswers,
      solution_markdown: document.getElementById("edSolutionMd").value,
      sympy_code: document.getElementById("edSympyCode").value || null,
    });
    state.lastBundleId = res.result.bundle_id;
    document.getElementById("editorPanel").classList.remove("open");
    showToast(`已保存人工定稿 (${res.result.bundle_id})`);
    await loadQueue();
  } catch (e) {
    showToast("保存失败: " + e.message, true);
  } finally {
    state.busy = false;
  }
}

function doSkip() {
  if (!state.queue.length) return;
  state.index = (state.index + 1) % state.queue.length;
  loadCurrentItem();
}

function toggleEditor(forceOpen = null) {
  const panel = document.getElementById("editorPanel");
  if (forceOpen === true) panel.classList.add("open");
  else if (forceOpen === false) panel.classList.remove("open");
  else panel.classList.toggle("open");
}

document.getElementById("btnAdoptPrimary").onclick = () => doAdopt("PRIMARY");
document.getElementById("btnAdoptSecondary").onclick = () => doAdopt("SECONDARY");
document.getElementById("btnAdoptBoth").onclick = () => doAdopt("BOTH");
document.getElementById("btnToggleEdit").onclick = () => toggleEditor();
document.getElementById("btnCloseEdit").onclick = () => toggleEditor(false);
document.getElementById("btnResolve").onclick = doResolve;
document.getElementById("btnSaveEdit").onclick = doSaveEdit;
document.getElementById("btnExclude").onclick = doExclude;
document.getElementById("btnReconfirm").onclick = doReconfirm;
document.getElementById("btnUndo").onclick = doUndo;
document.getElementById("btnSkip").onclick = doSkip;
document.getElementById("btnRefresh").onclick = () => loadQueue();

document.addEventListener("keydown", (ev) => {
  const tag = (document.activeElement?.tagName || "").toUpperCase();
  const inInput = tag === "TEXTAREA" || tag === "INPUT";
  if (ev.key === "Escape") {
    toggleEditor(false);
    document.activeElement?.blur();
    return;
  }
  if (inInput) {
    if (ev.ctrlKey && ev.key === "Enter") {
      ev.preventDefault();
      doSaveEdit();
    }
    return;
  }
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key.toUpperCase();
  if (k === "1") doAdopt("PRIMARY");
  else if (k === "2") doAdopt("SECONDARY");
  else if (k === "B") doAdopt("BOTH");
  else if (k === "E") toggleEditor();
  else if (k === "R") {
    toggleEditor(true);
    doResolve();
  }
  else if (k === "X") doExclude();
  else if (k === "S") doSkip();
  else if (k === "K") doReconfirm();
  else if (k === "U") doUndo();
});

loadQueue();
</script>
</body>
</html>
